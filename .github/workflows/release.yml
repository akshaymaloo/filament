name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0); must already exist'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, package, and draft release
    runs-on: macos-26
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify tag matches MARKETING_VERSION
        run: |
          PROJECT_VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)"
          if [ "$PROJECT_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.tag.outputs.version }} does not match MARKETING_VERSION $PROJECT_VERSION in project.yml"
            exit 1
          fi
          echo "Tag ${{ steps.tag.outputs.tag }} matches MARKETING_VERSION $PROJECT_VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and package
        run: scripts/package-release.sh dist

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: filament-${{ steps.tag.outputs.tag }}
          path: dist/*

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          NOTES_FILE="docs/release-notes/$TAG.md"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets"
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --draft \
              --title "Filament $VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --draft \
              --title "Filament $VERSION" \
              --generate-notes
          fi
